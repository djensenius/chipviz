name: Genesis host metadata preflight

on:
  pull_request:
    types: [labeled]
    paths:
      - .github/workflows/genesis-host-preflight.yml
      - scripts/genesis_host_preflight.py
      - tests/test_genesis_host_preflight.py
      - docs/genesis-host-preflight.md

permissions:
  contents: read

jobs:
  metadata:
    if: >-
      github.event.label.name == 'genesis-host-preflight-reviewed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/genesis_host_preflight.py
            tests/test_genesis_host_preflight.py
          sparse-checkout-cone-mode: false
      - name: Fake-only guard tests
        run: python3 -B tests/test_genesis_host_preflight.py
      - name: Collect limited host metadata
        run: |
          sudo -n env -i PATH=/usr/bin:/bin LC_ALL=C \
            GITHUB_ACTIONS="$GITHUB_ACTIONS" \
            RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" RUNNER_ARCH="$RUNNER_ARCH" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" GITHUB_EVENT_NAME="$GITHUB_EVENT_NAME" \
            /usr/bin/python3 -B scripts/genesis_host_preflight.py

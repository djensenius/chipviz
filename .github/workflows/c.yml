name: C

on:
  pull_request:
  push:
    branches: [main]

jobs:
  c:
    name: C lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.0
      - run: mise exec -- just c-lint
      - run: mise exec -- just c-test
      - run: mise exec -- just simulate

  pico:
    name: Pico firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4.2.0
      - name: Check out pinned Pico SDK 2.3.1
        uses: actions/checkout@v7
        with:
          repository: raspberrypi/pico-sdk
          ref: 079c6f39023649b154152db30f1d781e884879bc
          path: .cache/pico-sdk
          submodules: recursive
      - name: Cross-compile Pico ELF and UF2
        env:
          PICO_SDK_PATH: ${{ github.workspace }}/.cache/pico-sdk
        run: mise exec -- just pico-firmware

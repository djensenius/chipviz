name: Homebrew ROMs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  c64:
    name: C64 PRG
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Compile catalog ring with cc65
        run: |
          cc65 -t c64 -o "$RUNNER_TEMP/scene_catalog_v1_ring_default.s" shared/src/scene_catalog_v1_ring.c
          cc65 --standard c99 -t c64 -o "$RUNNER_TEMP/scene_catalog_v1_ring_c99.s" shared/src/scene_catalog_v1_ring.c
          printf '%s\n' '#include "chipviz/scene_catalog_v1_ring.h"' 'int main(void) { return 0; }' | cc65 -I shared/include -t c64 -o "$RUNNER_TEMP/scene_catalog_v1_header.s" /dev/stdin
          cc65 -Werror -t c64 -o "$RUNNER_TEMP/catalog_pairs_unused.s" tests/scene_catalog_v1_pairs_consumer.c
          cc65 -Werror -t c64 -DCHIPVIZ_TEST_USE_PAIR -o "$RUNNER_TEMP/catalog_pairs_used.s" tests/scene_catalog_v1_pairs_consumer.c
          cc65 --standard c99 -Werror -t c64 -o "$RUNNER_TEMP/catalog_pairs_unused_c99.s" tests/scene_catalog_v1_pairs_consumer.c
          cc65 --standard c99 -Werror -t c64 -DCHIPVIZ_TEST_USE_PAIR -o "$RUNNER_TEMP/catalog_pairs_used_c99.s" tests/scene_catalog_v1_pairs_consumer.c
          test -s "$RUNNER_TEMP/scene_catalog_v1_ring_default.s"
          test -s "$RUNNER_TEMP/scene_catalog_v1_ring_c99.s"
          test -s "$RUNNER_TEMP/scene_catalog_v1_header.s"
          test -s "$RUNNER_TEMP/catalog_pairs_unused.s"
          test -s "$RUNNER_TEMP/catalog_pairs_used.s"
          test -s "$RUNNER_TEMP/catalog_pairs_unused_c99.s"
          test -s "$RUNNER_TEMP/catalog_pairs_used_c99.s"
      - name: Build C64 PRG
        run: make -C cores/c64/homebrew
      - name: Verify C64 PRG
        run: test -s cores/c64/homebrew/chipviz-c64.prg

  gba:
    name: GBA ROM
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build GBA ROM
        run: make -C cores/gba/homebrew
      - name: Verify GBA ROM
        run: test -s cores/gba/homebrew/chipviz-gba.gba

  n64:
    name: N64 ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build N64 ROM
        run: scripts/n64-docker-build.sh
      - name: Verify N64 ROM
        run: test -s cores/n64/homebrew/chipviz-n64.z64

  snes:
    name: SNES ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install PVSnesLib
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison cmake flex
          git init "$RUNNER_TEMP/pvsneslib"
          git -C "$RUNNER_TEMP/pvsneslib" remote add origin https://github.com/alekmaul/pvsneslib.git
          git -C "$RUNNER_TEMP/pvsneslib" fetch --depth 1 origin d0bd46bc70c16a4cb9c8d40a90468e18a6de9b1c
          git -C "$RUNNER_TEMP/pvsneslib" checkout --detach FETCH_HEAD
          git -C "$RUNNER_TEMP/pvsneslib" submodule update --init --recursive --depth 1
          export PVSNESLIB_HOME="$RUNNER_TEMP/pvsneslib"
          make -C "$RUNNER_TEMP/pvsneslib/compiler"
          make -C "$RUNNER_TEMP/pvsneslib/compiler" install
          make -C "$RUNNER_TEMP/pvsneslib/tools"
          make -C "$RUNNER_TEMP/pvsneslib/tools" install
          make -C "$RUNNER_TEMP/pvsneslib/pvsneslib"
          echo "PVSNESLIB_HOME=$PVSNESLIB_HOME" >> "$GITHUB_ENV"
      - name: Build SNES ROM
        run: make -C cores/snes/homebrew
      - name: Verify SNES ROM
        run: test -s cores/snes/homebrew/chipviz-snes.sfc

  gb:
    name: Game Boy ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install RGBDS
        run: |
          sudo apt-get update
          sudo apt-get install -y bison build-essential libpng-dev pkg-config
          git clone --depth 1 --branch v1.0.1 https://github.com/gbdev/rgbds.git "$RUNNER_TEMP/rgbds"
          make -C "$RUNNER_TEMP/rgbds"
          sudo make -C "$RUNNER_TEMP/rgbds" install
      - name: Build Game Boy ROM
        run: make -C cores/gb/homebrew
      - name: Build Game Boy operator and fixture ROMs
        run: make -C cores/gb/homebrew INPUT_ROLE=operator && make -C cores/gb/homebrew FIXTURE=1
      - name: Verify Game Boy ROMs
        run: test -s cores/gb/homebrew/chipviz-gb.gb && test -s cores/gb/homebrew/chipviz-gb-operator.gb && test -s cores/gb/homebrew/chipviz-gb-fixture.gb

  genesis:
    name: Genesis ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Genesis ROM
        run: make -C cores/genesis/homebrew
      - name: Verify Genesis ROM
        run: test -s cores/genesis/homebrew/chipviz-genesis.md

  nes:
    name: NES ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cc65
        run: sudo apt-get update && sudo apt-get install -y cc65
      - name: Build NES ROM
        run: make -C cores/nes/homebrew
      - name: Build NES operator ROM
        run: make -C cores/nes/homebrew INPUT_ROLE=operator
      - name: Verify NES ROMs
        run: test -s cores/nes/homebrew/chipviz-nes.nes && test -s cores/nes/homebrew/chipviz-nes-operator.nes

  sms:
    name: Master System ROM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Master System ROM
        run: make -C cores/sms/homebrew
      - name: Verify Master System ROM
        run: test -s cores/sms/homebrew/chipviz-sms.sms

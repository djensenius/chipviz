[package]
name = "chipviz-modern"
version = "0.1.0"
edition = "2024"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
bytemuck = { version = "1.24", features = ["derive"] }
cpal = "0.18"
png = "0.17"
pollster = "0.4"
realfft = "3.5"
rtrb = "0.4"
wgpu = "0.20"
winit = "0.29"

[features]
# Flash/gate (colour-field palettes 3 and 7) can latch, and the mic layers
# (whose red flashes are not yet bounded) are drawn, only with this feature.
# Neither has been measured by an independent photosensitivity analyser (PEAT
# or a Harding-style flash and red-flash check), so it is off by default and
# must not ship until they have been.
unmeasured-flash = []

[[bin]]
name = "chipviz-pi5"
path = "src/bin/chipviz-pi5.rs"

[[bin]]
name = "chipviz-m1"
path = "src/bin/chipviz-m1.rs"

[[bin]]
name = "chipviz-capture"
path = "src/bin/chipviz-capture.rs"

# winit 0.29's macOS backend enumerates NSScreen through icrate 0.0.4, whose
# debug-only objc2 encoding check panics on newer macOS (NSUInteger 'Q' vs
# declared 'q'). The ABI is identical, so skip that check in dev builds to keep
# fullscreen/monitor queries working with `cargo run`.
# Remove this override after upgrading to winit 0.30+ (objc2-foundation backend).
[profile.dev.package.objc2]
debug-assertions = false
